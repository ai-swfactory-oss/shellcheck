name: update

# Daily: if koalaman/shellcheck has a newer non-prerelease release, rewrite
# upstream.json for it (asset names and the sha256 digests GitHub reports for
# them, repack reset to 0) and commit it. Then make sure the packages for the
# current upstream.json are published: every successful publish ends with a
# GitHub release v<version>, so a missing release means "not published yet",
# and a failed build is retried every day until it succeeds.
#
# Monthly: keep the schedule alive. GitHub disables scheduled workflows after
# 60 days without repository activity, and upstream releases are rare.

on:
  schedule:
    - cron: "23 4 * * *"
    - cron: "41 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: write
  id-token: write
  attestations: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    outputs:
      missing: ${{ steps.check.outputs.missing }}
      sha: ${{ steps.commit.outputs.sha }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Keepalive (monthly)
        if: github.event.schedule == '41 5 1 * *'
        run: gh api -X PUT "repos/$GH_REPO/actions/workflows/update.yml/enable"

      - name: Follow the latest upstream release
        run: |
          release=$(gh api repos/koalaman/shellcheck/releases/latest)
          if [ "$(jq -r '.prerelease or .draft' <<<"$release")" != false ]; then
            echo "latest upstream release is a prerelease or draft: ignoring"; exit 0
          fi
          latest=$(jq -er '.tag_name | ltrimstr("v")' <<<"$release")
          current=$(jq -er .version upstream.json)
          newest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n1)
          if [ "$latest" = "$current" ] || [ "$newest" != "$latest" ]; then
            echo "upstream $latest, ours $current: nothing to do"; exit 0
          fi
          echo "upstream $latest is newer than $current: updating upstream.json"
          jq --arg v "$latest" '
            def asset($suffix):
              ("shellcheck-v\($v).\($suffix).tar.xz") as $n
              | (first($release[0].assets[] | select(.name == $n)) // error("asset \($n) missing"))
              | if (.digest // "" | startswith("sha256:")) then {name: .name, digest: .digest}
                else error("asset \($n) has no sha256 digest") end;
            {
              version: $v,
              repack: 0,
              assets: {
                "linux-x64": asset("linux.x86_64"),
                "linux-arm64": asset("linux.aarch64"),
                "darwin-x64": asset("darwin.x86_64"),
                "darwin-arm64": asset("darwin.aarch64")
              }
            }' --slurpfile release <(printf '%s' "$release") -n > upstream.json.new
          mv upstream.json.new upstream.json
          cat upstream.json

      - name: Commit upstream.json
        id: commit
        run: |
          if ! git diff --quiet upstream.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: update ShellCheck to $(jq -r .version upstream.json)"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Is this version published?
        id: check
        run: |
          tag="v$(bash scripts/pkgver.sh)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "missing=false" >> "$GITHUB_OUTPUT"; echo "$tag already released"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"; echo "$tag not released: building"
          fi

  build:
    needs: update
    if: needs.update.outputs.missing == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.update.outputs.sha }}
      publish: true
    secrets: inherit
